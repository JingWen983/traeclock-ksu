name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust (aarch64/armv7/x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Locate NDK
        run: |
          # prefer the runner's NDK r27 LTS (ANDROID_NDK), fall back to LATEST, then download
          if [ -n "$ANDROID_NDK" ] && [ -d "$ANDROID_NDK" ]; then
            echo "NDK=$ANDROID_NDK" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
            unzip -q android-ndk-r27d-linux.zip -d "$HOME"
            echo "NDK=$HOME/android-ndk-r27d" >> "$GITHUB_ENV"
          fi

      - name: Run tests (host)
        working-directory: daemon
        run: cargo test --workspace

      - name: Build release binaries for 3 ABIs (cargo-ndk)
        working-directory: daemon
        env:
          ANDROID_NDK_HOME: ${{ env.NDK }}
        run: |
          # cargo-ndk configures per-target linkers AND creates the unversioned
          # clang shims that cc-rs (ring) needs. NOTE: --platform is the API
          # level; -p means --package in cargo-ndk.
          cargo ndk --platform 26 \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -- build --release --workspace
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for pair in "arm64-v8a aarch64-linux-android" "armeabi-v7a armv7-linux-androideabi" "x86_64 x86_64-linux-android"; do
            set -- $pair
            abi="$1"; triple="$2"
            mkdir -p "dist/$abi"
            cp "target/$triple/release/traeclockd"   "dist/$abi/"
            cp "target/$triple/release/traeclockctl" "dist/$abi/"
            "$STRIP" "dist/$abi/traeclockd" "dist/$abi/traeclockctl"
          done
          ls -la dist/*/ | head -30

      - name: Assemble KernelSU module zip
        run: |
          VERSION=$(grep '^version =' daemon/Cargo.toml | head -1 | cut -d'"' -f2)
          STAGE="module-stage"
          cp -r module "$STAGE"
          mkdir -p "$STAGE/bin"
          cp -r daemon/dist/arm64-v8a daemon/dist/armeabi-v7a daemon/dist/x86_64 "$STAGE/bin/"
          cd "$STAGE"
          zip -r "../TraeClock-${VERSION}.zip" .
          cd ..
          mv "TraeClock-${VERSION}.zip" TraeClock.zip
          ls -la TraeClock.zip

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: TraeClock.zip

  app:
    name: Manager App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a full Android SDK at $ANDROID_HOME — just accept licenses
      - name: Accept SDK licenses + ensure platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # package name is android-37.0 (NOT android-37); build-tools 37.x line
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          BT37=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -oE "build-tools;37\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$BT37" ] && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$BT37" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        working-directory: app
        run: gradle assembleRelease --no-daemon

      - name: Sign APK
        working-directory: app
        env:
          KS_B64: ${{ secrets.TRAECLOCK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.TRAECLOCK_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TRAECLOCK_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.TRAECLOCK_KEY_PASSWORD }}
        run: |
          SDK="$ANDROID_HOME/build-tools"
          BT=$(ls "$SDK" | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$SDK/$BT/zipalign" -f 4 "$APK" /tmp/app-aligned.apk
          if [ -n "$KS_B64" ]; then
            # defensive: strip any whitespace/newlines GitHub might carry in the secret
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > /tmp/traeclock.jks
            ls -la /tmp/traeclock.jks
            "$SDK/$BT/apksigner" sign --ks /tmp/traeclock.jks --ks-type PKCS12 \
              --ks-pass "pass:${KS_PASS:-}" --ks-key-alias "${KS_ALIAS:-traeclock}" \
              --key-pass "pass:${KS_KEYPASS:-${KS_PASS:-}}" /tmp/app-aligned.apk
            "$SDK/$BT/apksigner" verify --print-certs /tmp/app-aligned.apk
            cp /tmp/app-aligned.apk app-release-signed.apk
          else
            # no secrets: ephemeral debug keystore so the APK is installable
            keytool -genkeypair -keystore /tmp/traeclock-debug.jks -storepass traeclock \
              -keypass traeclock -alias traeclock -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TraeClock Debug,O=TraeClock,C=CN"
            "$SDK/$BT/apksigner" sign --ks /tmp/traeclock-debug.jks \
              --ks-pass pass:traeclock --ks-key-alias traeclock --key-pass pass:traeclock \
              /tmp/app-aligned.apk
            cp /tmp/app-aligned.apk app-release-signed.apk
          fi
          ls -la app-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-apk
          path: app/app-release-signed.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: module-zip
      - uses: actions/download-artifact@v4
        with:
          name: manager-apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TraeClock.zip
            app-release-signed.apk
          generate_release_notes: true
