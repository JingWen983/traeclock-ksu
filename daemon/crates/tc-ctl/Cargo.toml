[package]
name = "tc-ctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "traeclockd daemon + traeclockctl management CLI for the TraeClock KernelSU module"

[[bin]]
name = "traeclockd"
path = "src/bin/traeclockd.rs"

[[bin]]
name = "traeclockctl"
path = "src/bin/traeclockctl.rs"

[dependencies]
tc-core = { path = "../tc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
ureq = { workspace = true }
rustls = { workspace = true }
